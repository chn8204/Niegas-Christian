<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tanex Yamaha</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f8fafc;
      margin: 0;
      padding: 0;
      color: #1e293b;
    }
    .navbar {
      width: 100%;
      background: #1e293b;
      border-radius: 0 0 20px 20px;
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 16px 0;
      margin-bottom: 24px;
    }
    .navbar a {
      color: #fff;
      font-size: 1.3em;
      text-decoration: none;
      font-weight: bold;
      padding: 8px 18px;
      border-radius: 12px;
      transition: background 0.2s;
    }
    .navbar a:hover {
      background: #334155;
    }
    .main-content {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 32px;
      max-width: 1200px;
      margin: 0 auto 32px auto;
      padding: 0 16px;
    }
    .intro {
      flex: 1 1 340px;
      min-width: 300px;
    }
    .intro h1 {
      font-size: 2.8em;
      font-family: 'Arial Black', Arial, sans-serif;
      margin: 0 0 12px 0;
      color: #1e293b;
    }
    .intro p {
      font-size: 1.25em;
      margin-bottom: 18px;
    }
    .socials {
      display: flex;
      gap: 18px;
      margin-top: 10px;
    }
    .social-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #1e293b;
      font-size: 0.95em;
      font-weight: 500;
      transition: color 0.2s;
    }
    .social-link:hover {
      color: #2563eb;
    }
    .social-link img {
      border-radius: 50%;
      width: 44px;
      height: 44px;
      margin-bottom: 4px;
      box-shadow: 0 2px 8px #0001;
      background: #fff;
    }
    .featured-model {
      background: #f1f5f9;
      border-radius: 30px;
      border: 2px solid #64748b;
      padding: 18px;
      text-align: center;
      min-width: 320px;
      max-width: 350px;
      margin: 0 auto;
    }
    .featured-model img {
      border-radius: 30px;
      width: 100%;
      max-width: 300px;
      height: auto;
      margin-bottom: 10px;
    }
    .featured-model-title {
      font-size: 1.3em;
      font-weight: bold;
      color: #1e293b;
    }
    .models-section {
      max-width: 1200px;
      margin: 0 auto 32px auto;
      padding: 0 16px;
    }
    .models-title {
      text-align: center;
      font-size: 2em;
      font-family: 'Arial Black', Arial, sans-serif;
      color: #1e293b;
      margin-bottom: 18px;
    }
    .models-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 22px;
      justify-content: center;
    }
    .model-card {
      background: #f9fafb;
      border-radius: 20px;
      border: 2px solid #64748b;
      padding: 16px 10px;
      text-align: center;
      width: 150px;
      transition: box-shadow 0.2s;
      cursor: pointer;
    }
    .model-card:hover {
      box-shadow: 0 4px 16px #64748b33;
      background: #e0e7ef;
    }
    .model-card img {
      border-radius: 20px;
      width: 120px;
      height: 80px;
      object-fit: cover;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .model-card-title {
      font-size: 1.1em;
      font-weight: bold;
      color: #1e293b;
    }
    .desc-section {
      background: #f1f5f9;
      border-radius: 20px;
      border: 1.5px solid #64748b;
      max-width: 900px;
      margin: 32px auto;
      padding: 24px 28px;
    }
    .desc-section h2 {
      text-align: center;
      font-size: 1.7em;
      font-family: 'Arial Black', Arial, sans-serif;
      color: #1e293b;
      margin-bottom: 18px;
    }
    .desc-section ul {
      font-size: 1.08em;
      line-height: 1.7;
      padding-left: 18px;
    }
    /* Modal styles */
    #reviewModal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #0006;
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    #reviewModal .modal-content {
      background: #fff;
      border-radius: 30px;
      border: 2px solid #64748b;
      padding: 24px 32px;
      max-width: 600px;
      width: 95vw;
      margin: 40px auto;
      box-shadow: 0 8px 32px #0003;
    }
    #reviewModal img {
      border-radius: 20px;
      width: 220px;
      height: 150px;
      object-fit: cover;
      margin-bottom: 12px;
    }
    #reviewModal .close-btn {
      float: right;
      font-size: 1.5em;
      background: #e2e8f0;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      margin-top: -12px;
      margin-right: -12px;
    }
    @media (max-width: 900px) {
      .main-content {
        flex-direction: column;
        align-items: stretch;
      }
      .featured-model {
        margin-top: 24px;
      }
      .models-grid {
        gap: 14px;
      }
      .desc-section {
        padding: 16px 6px;
      }
    }
  </style>
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="index.html">HOME</a>
    <a href="About.html">ABOUT</a>
    <a href="Contact.html">CONTACT</a>

  </nav>

  <!-- Main Content -->
  <div class="main-content">
    <div class="intro">
      <h1>Yamaha Power</h1>
      <p>
        <b>Experience the speed, innovation, and precision of Yamaha Motorcycles.</b><br>
        Ride with confidence and style, wherever the road takes you.
      </p>
      <div class="socials">
        <a class="social-link" href="https://www.instagram.com/" target="_blank" title="Instagram">
          <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram">
          Instagram
        </a>
        <a class="social-link" href="https://www.facebook.com/" target="_blank" title="Facebook">
          <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="Facebook">
          Facebook
        </a>
        <a class="social-link" href="https://twitter.com/" target="_blank" title="Twitter">
          <img src="https://upload.wikimedia.org/wikipedia/commons/6/6f/Logo_of_Twitter.svg" alt="Twitter">
          Twitter
        </a>
        <a class="social-link" href="https://www.linkedin.com/" target="_blank" title="LinkedIn">
          <img src="https://upload.wikimedia.org/wikipedia/commons/c/ca/LinkedIn_logo_initials.png" alt="LinkedIn">
          LinkedIn
        </a>
      </div>
    </div>
    <div class="featured-model">
      <img src="images/Image2.jpg" alt="Aerox">
      <div class="featured-model-title">Featured Model</div>
    </div>
  </div>

  <!-- Yamaha Models Section -->
  <section class="models-section">
    <div class="models-title">Yamaha Models</div>
    <div class="models-grid">
      <!-- ...model cards as before... -->
    </div>
  </section>

  <!-- ...rest of your HTML unchanged... -->
</body>
</html>
